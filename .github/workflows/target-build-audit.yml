name: Target-native build and dependency audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'build.sh'
      - 'install_deps.sh'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'tools/**'
      - 'native-src/**'
      - 'meson_wrapfiles/**'
      - 'wlroots_deps/**'
      - '.github/workflows/target-build-audit.yml'
  push:
    paths:
      - 'build.sh'
      - 'install_deps.sh'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'tools/**'
      - 'native-src/**'
      - 'meson_wrapfiles/**'
      - 'wlroots_deps/**'
      - '.github/workflows/target-build-audit.yml'

permissions:
  contents: read

jobs:
  target-build:
    name: Build and audit (${{ matrix.target }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: debian-13
            image: debian@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
          - target: ubuntu-24.04
            image: ubuntu@sha256:24737cef17f4e22b1977df7d9a05e77c4e28b7da5b8911f8d8ccda136bf3573c
          - target: ubuntu-26.04
            image: ubuntu@sha256:19fcd1bf268f02b60aca3bd30bd8a6d9a11759a430e32921833e65f16d87348a
          - target: fedora-44
            image: fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
          - target: archlinux
            image: archlinux@sha256:3cbf69d2d5958d6a294f3722c5668e6187c4df8e00fa27f72352f0bf83e495e1
            target_repo_snapshot: "2026-10-26"
          - target: alpine-3.24
            image: alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a

    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Go toolchain for glibc target containers
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false

      - name: Record host Go root
        run: echo "HOST_GO_ROOT=$(go env GOROOT)" >> "$GITHUB_ENV"

      - name: Prepare audit output directory
        env:
          TARGET: ${{ matrix.target }}
        run: mkdir -p "build/target-audit/$TARGET"

      - name: Build and capture target ABI/runtime evidence
        env:
          TARGET: ${{ matrix.target }}
          IMAGE: ${{ matrix.image }}
          TARGET_REPO_SNAPSHOT: ${{ matrix.target_repo_snapshot || 'not-pinned' }}
        run: |
          set -euo pipefail
          output="build/target-audit/$TARGET"
          docker pull "$IMAGE"
          case "$IMAGE" in *@sha256:*) ;; *) echo "Target container image must be digest-pinned: $IMAGE" >&2; exit 1 ;; esac
          image_digest="${IMAGE##*@}"
          docker image inspect "$IMAGE" >/dev/null
          common_args=(
            run --rm --platform linux/amd64
            -e TARGET_ID="$TARGET"
            -e TARGET_IMAGE="$IMAGE"
            -e TARGET_IMAGE_DIGEST="$image_digest"
            -e TARGET_ARCH=amd64
            -e GITHUB_RUN_ID="$GITHUB_RUN_ID"
            -e GITHUB_SHA="$GITHUB_SHA"
            -v "$GITHUB_WORKSPACE:/src"
            -w /src
          )

          if [[ "$TARGET" == "alpine-3.24" ]]; then
            # Alpine deliberately uses its own musl-native Go toolchain.
            docker "${common_args[@]}" "$IMAGE" sh tools/ci/target-build-audit.sh 2>&1 | tee "$output/container.log"
          else
            # Distro packages in older glibc images may ship Go < 1.24.
            # Mount the pinned official toolchain from setup-go into the
            # container; GOTOOLCHAIN=local prevents a network toolchain swap.
            docker "${common_args[@]}" \
              -v "$HOST_GO_ROOT:/host-go:ro" \
              -e GOROOT=/host-go \
              -e GOTOOLCHAIN=local \
              -e PATH=/host-go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
              "$IMAGE" sh tools/ci/target-build-audit.sh 2>&1 | tee "$output/container.log"
          fi

      - name: Upload target audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-audit-${{ matrix.target }}-${{ github.sha }}
          path: build/target-audit/${{ matrix.target }}/**
          if-no-files-found: warn
          retention-days: 14
