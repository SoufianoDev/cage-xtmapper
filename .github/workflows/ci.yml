name: Validate build inputs

on:
  pull_request:
    paths:
      - 'build.sh'
      - 'install_deps.sh'
      - 'install.sh'
      - 'tools/**'
      - 'cage_xtmapper.sh'
      - 'go.mod'
      - 'cmd/**'
      - 'internal/**'
      - 'native-src/**'
      - 'wlroots_deps/**'
      - 'meson_wrapfiles/**'
      - 'tests/**'
      - 'SHA256SUMS'
      - '.github/workflows/**'
  push:
    paths:
      - 'build.sh'
      - 'install_deps.sh'
      - 'install.sh'
      - 'tools/**'
      - 'cage_xtmapper.sh'
      - 'go.mod'
      - 'cmd/**'
      - 'internal/**'
      - 'native-src/**'
      - 'wlroots_deps/**'
      - 'meson_wrapfiles/**'
      - 'tests/**'
      - 'SHA256SUMS'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo ./install_deps.sh
          sudo apt-get install --yes shellcheck

      - name: Verify vendored dependency archives
        run: sha256sum --check SHA256SUMS

      - name: Check shell syntax and style
        run: |
          for script in build.sh install.sh install_deps.sh cage_xtmapper.sh tests/*.sh; do bash -n "$script"; done
          shellcheck build.sh install.sh install_deps.sh cage_xtmapper.sh tests/*.sh

      - name: Run shell fixture checks
        run: |
          bash tests/test-install-deps.sh
          bash tests/test-build.sh
          bash tests/test-launcher.sh

      - name: Build the single ELF
        run: ./build.sh

      - name: Check Go formatting, runtime and installation
        run: |
          format_files="$(gofmt -l cmd internal tools tests)"
          if [[ -n "$format_files" ]]; then
            printf 'Go files need formatting:\n%s\n' "$format_files"
            gofmt -d cmd internal tools tests
            exit 1
          fi
          export CC=clang PKG_CONFIG_PATH="$PWD/build/native/pkgconfig"
          go vet ./...
          go test -race -count=1 ./...
          bash tests/test-installer-local.sh --skip-build
