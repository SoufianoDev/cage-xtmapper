name: One-time cleanup of exposed ephemeral APK CI artifact

on:
  push:
    branches:
      - feat/native-package-release-audit-20261027
    paths:
      - '.github/workflows/cleanup-exposed-apk-artifact.yml'

permissions:
  actions: write
  contents: read

jobs:
  delete-exposed-artifact:
    runs-on: ubuntu-26.04
    steps:
      - name: Delete the specific artifact that contained the disposable CI key
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          artifact_id=12733923830
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/artifacts/$artifact_id")"
          if [[ "$status" != 204 ]]; then
            cat "$response_file" >&2
            echo "Expected HTTP 204 deleting artifact $artifact_id; received $status." >&2
            exit 1
          fi
          rm -f "$response_file"

          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/artifacts?per_page=100" \
            -o /tmp/artifacts.json
          if jq -e --argjson id "$artifact_id" '.artifacts[] | select(.id == $id)' /tmp/artifacts.json >/dev/null; then
            echo "Artifact $artifact_id is still present after deletion." >&2
            exit 1
          fi
          echo "Deleted and verified removal of artifact $artifact_id."
