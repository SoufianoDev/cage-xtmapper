name: Package release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build dependencies
        run: sudo ./install_deps.sh

      - name: Build
        run: ./build.sh

      - name: Verify runtime and installation
        run: |
          export CC=clang PKG_CONFIG_PATH="$PWD/build/native/pkgconfig"
          go vet ./...
          go test -race -count=1 ./...

      - name: Package versioned archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: go run ./tools/release package --version "$RELEASE_TAG" --output "cage-xtmapper-${RELEASE_TAG}.tar"

      - name: Attach archive to the matching release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: cage-xtmapper-${{ github.ref_name }}.tar
          draft: true
          fail_on_unmatched_files: true
          overwrite_files: false
