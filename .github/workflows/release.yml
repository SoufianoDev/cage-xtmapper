name: Package release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-release-tag:
    runs-on: ubuntu-26.04
    outputs:
      package_version: ${{ steps.validate.outputs.package_version }}
    steps:
      - name: Validate release tag and native package version
        id: validate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+|[0-9]+([.][0-9]+){2})$ ]]; then
            echo "Release tag must be vYYYYMMDD-style numeric or vMAJOR.MINOR.PATCH; got $RELEASE_TAG" >&2
            exit 2
          fi
          package_version="$(printf '%s' "$RELEASE_TAG" | sed 's/^v//')"
          if [[ "$package_version" == "0.0.0" ]]; then
            echo "v0.0.0 has no lower numeric package version for lifecycle testing." >&2
            exit 2
          fi
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

  package:
    needs: validate-release-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-26.04
          - architecture: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Install build dependencies
        run: sudo ./install_deps.sh

      - name: Build
        run: ./build.sh

      - name: Verify runtime and installation
        run: |
          export CC=clang PKG_CONFIG_PATH="$PWD/build/native/pkgconfig"
          go vet ./...
          go test -race -count=1 ./...
          bash tests/test-installer-local.sh --skip-build

      - name: Package versioned archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_ARCH: ${{ matrix.architecture }}
        run: |
          archive="cage-xtmapper-$RELEASE_TAG-$TARGET_ARCH.tar"
          go run ./tools/release package --version "$RELEASE_TAG" --output "$archive"
          sha256sum "$archive" > "$archive.sha256"

      - name: Build standalone installer helper
        env:
          TARGET_ARCH: ${{ matrix.architecture }}
        run: |
          asset="cage-xtmapper-installer-linux-$TARGET_ARCH"
          GOOS=linux GOARCH="$TARGET_ARCH" CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "$asset" ./tools/install
          sha256sum "$asset" > "$asset.sha256"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.architecture }}
          path: |
            cage-xtmapper-${{ github.ref_name }}-${{ matrix.architecture }}.tar
            cage-xtmapper-${{ github.ref_name }}-${{ matrix.architecture }}.tar.sha256
            cage-xtmapper-installer-linux-${{ matrix.architecture }}
            cage-xtmapper-installer-linux-${{ matrix.architecture }}.sha256
          if-no-files-found: error

  native-candidates:
    needs: validate-release-tag
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: debian-13
            image: debian@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
          - target: ubuntu-24.04
            image: ubuntu@sha256:24737cef17f4e22b1977df7d9a05e77c4e28b7da5b8911f8d8ccda136bf3573c
          - target: ubuntu-26.04
            image: ubuntu@sha256:19fcd1bf268f02b60aca3bd30bd8a6d9a11759a430e32921833e65f16d87348a
          - target: fedora-44
            image: fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
          - target: archlinux
            image: archlinux@sha256:3cbf69d2d5958d6a294f3722c5668e6187c4df8e00fa27f72352f0bf83e495e1
            target_repo_snapshot: "2026-10-26"
          - target: alpine-3.24
            image: alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Go toolchain for glibc target containers
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false

      - name: Record host Go root
        run: echo "HOST_GO_ROOT=$(go env GOROOT)" >> "$GITHUB_ENV"

      - name: Build and verify the versioned native package
        env:
          TARGET: ${{ matrix.target }}
          IMAGE: ${{ matrix.image }}
          TARGET_REPO_SNAPSHOT: ${{ matrix.target_repo_snapshot || 'not-pinned' }}
          PACKAGE_VERSION: ${{ needs.validate-release-tag.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          output="build/target-audit/$TARGET"
          mkdir -p "$output"
          docker pull "$IMAGE"
          case "$IMAGE" in *@sha256:*) ;; *) echo "Target image must be digest-pinned: $IMAGE" >&2; exit 1 ;; esac
          image_digest="$(printf '%s' "$IMAGE" | sed 's/^.*@//')"
          common_args=(
            run --rm --platform linux/amd64
            -e TARGET_ID="$TARGET"
            -e TARGET_IMAGE="$IMAGE"
            -e TARGET_IMAGE_DIGEST="$image_digest"
            -e TARGET_REPO_SNAPSHOT="$TARGET_REPO_SNAPSHOT"
            -e TARGET_ARCH=amd64
            -e PACKAGE_VERSION="$PACKAGE_VERSION"
            -e GITHUB_RUN_ID="$GITHUB_RUN_ID"
            -e GITHUB_SHA="$GITHUB_SHA"
            -v "$GITHUB_WORKSPACE:/src"
            -w /src
          )

          if [[ "$TARGET" == alpine-3.24 ]]; then
            docker "${common_args[@]}" -e APK_CI_KEY_DIR=/tmp/cage-xtmapper-apk-ci-key "$IMAGE" sh tools/ci/target-build-audit.sh 2>&1 | tee "$output/container.log"
          else
            docker "${common_args[@]}" \
              -v "$HOST_GO_ROOT:/host-go:ro" \
              -e GOROOT=/host-go \
              -e GOTOOLCHAIN=local \
              -e PATH=/host-go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
              "$IMAGE" sh tools/ci/target-build-audit.sh 2>&1 | tee "$output/container.log"
          fi

          release_dir="build/release-candidates"
          mkdir -p "$release_dir"
          case "$TARGET" in
            debian-13)
              package_path="$output/cage-xtmapper_$PACKAGE_VERSION""_amd64.deb"
              asset="cage-xtmapper-$GITHUB_REF_NAME-debian-13-amd64.deb"
              ;;
            ubuntu-24.04)
              package_path="$output/cage-xtmapper_$PACKAGE_VERSION""_amd64.deb"
              asset="cage-xtmapper-$GITHUB_REF_NAME-ubuntu-24.04-amd64.deb"
              ;;
            ubuntu-26.04)
              package_path="$output/cage-xtmapper_$PACKAGE_VERSION""_amd64.deb"
              asset="cage-xtmapper-$GITHUB_REF_NAME-ubuntu-26.04-amd64.deb"
              ;;
            fedora-44)
              package_path="$output/cage-xtmapper-$PACKAGE_VERSION-1.rpm"
              asset="cage-xtmapper-$GITHUB_REF_NAME-fedora-44-x86_64.rpm"
              ;;
            archlinux)
              package_path="$output/cage-xtmapper-$PACKAGE_VERSION-1-x86_64.pkg.tar.zst"
              asset="cage-xtmapper-$GITHUB_REF_NAME-archlinux-x86_64.pkg.tar.zst"
              ;;
            alpine-3.24)
              package_path="$output/cage-xtmapper-$PACKAGE_VERSION-r0.apk"
              asset="cage-xtmapper-$GITHUB_REF_NAME-alpine-3.24-x86_64.apk"
              ;;
            *)
              echo "No release package mapping for target $TARGET." >&2
              exit 2
              ;;
          esac
          [[ -s "$package_path" ]] || { echo "Expected release candidate is missing: $package_path" >&2; exit 1; }
          cp "$package_path" "$release_dir/$asset"
          (cd "$release_dir" && sha256sum "$asset" > "$asset.sha256")

          cp "$output/environment.txt" "$release_dir/evidence-$TARGET-environment.txt"
          cp "$output/manifest.json" "$release_dir/evidence-$TARGET-manifest.json"
          cp "$output/provenance.txt" "$release_dir/evidence-$TARGET-provenance.txt"
          for report in "$output"/*-lifecycle-result.txt "$output"/package-removal-*.txt "$output"/*.status "$output"/*.info.txt "$output"/*.contents.txt "$output"/*.requires.txt "$output"/*.depends.txt; do
            [[ -f "$report" ]] || continue
            cp "$report" "$release_dir/evidence-$TARGET-$(basename "$report")"
          done

      - name: Upload native package candidate and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-release-${{ matrix.target }}-${{ github.sha }}
          path: build/release-candidates/*
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs:
      - validate-release-tag
      - package
      - native-candidates
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ needs.validate-release-tag.outputs.package_version }}
    steps:
      - name: Download versioned archive and helper assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: dist

      - name: Download target-native package candidates
        uses: actions/download-artifact@v4
        with:
          pattern: native-release-*
          merge-multiple: true
          path: dist

      - name: Verify checksums and generate the versioned release asset index
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd dist
          for checksum in *.sha256; do
            sha256sum --check "$checksum"
          done
          cd ..

          index_asset() {
            file="$1"
            target="$2"
            architecture="$3"
            format="$4"
            status="$5"
            notes="$6"
            base="$(basename "$file")"
            digest="$(sha256sum "$file" | awk '{print $1}')"
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$base"
            printf '| [%s](%s) ([SHA-256](%s.sha256)) | %s | %s | %s | %s | %s | %s |\n' \
              "$base" "$url" "$url" "$target" "$architecture" "$format" "$status" "$digest" "$notes"
          }

          {
            printf '# Release asset index — %s\n\n' "$GITHUB_REF_NAME"
            printf -- '- Source commit: %s\n- Native package version: %s (release tag prefix v removed)\n' "$GITHUB_SHA" "$PACKAGE_VERSION"
            printf -- '- No native package in this draft is marked Supported. CI does not prove startup in a real Wayland/graphics session or SteamOS/Bazzite host integration.\n'
            printf -- '- SHA-256 sidecars detect corruption but do not authenticate the publisher.\n'
            printf -- '- Alpine APK uses a disposable CI signing key, not an approved production key. Do not treat its signature as publisher authentication; manual installation requires a deliberate trust bypass unless the maintainer approves and deploys a production signing process.\n\n'
            printf '| Asset | Target/build baseline | Architecture | Format | Status | SHA-256 | Notes |\n'
            printf '|---|---|---|---|---|---|---|\n'

            for file in dist/cage-xtmapper-"$GITHUB_REF_NAME"-*.tar; do
              [[ -f "$file" ]] || continue
              case "$(basename "$file")" in
                *-amd64.tar) arch="amd64" ;;
                *-arm64.tar) arch="arm64" ;;
                *) arch="unknown" ;;
              esac
              index_asset "$file" "Ubuntu 26.04.1 build baseline; generic release archive" "$arch" ".tar" "Experimental" "Host libraries and real-session compatibility must be checked on the target system."
            done

            for file in dist/cage-xtmapper-"$GITHUB_REF_NAME"-*.deb; do
              [[ -f "$file" ]] || continue
              base="$(basename "$file")"
              case "$base" in
                *-debian-13-amd64.deb) target="Debian 13.7 (Trixie)";;
                *-ubuntu-24.04-amd64.deb) target="Ubuntu 24.04.5 LTS";;
                *-ubuntu-26.04-amd64.deb) target="Ubuntu 26.04.1 LTS";;
                *) target="Unknown Debian-family target";;
              esac
              index_asset "$file" "$target" "amd64" ".deb" "Experimental" "Container package/dependency/lifecycle checks pass; real Wayland and Waydroid session launch is not yet proven."
            done

            for file in dist/cage-xtmapper-"$GITHUB_REF_NAME"-*.rpm; do
              [[ -f "$file" ]] || continue
              index_asset "$file" "Fedora 44" "x86_64" ".rpm" "Experimental" "RPM dependency and lifecycle checks pass in a container; Bazzite host testing is separate and has not been done."
            done

            for file in dist/cage-xtmapper-"$GITHUB_REF_NAME"-*.pkg.tar.zst; do
              [[ -f "$file" ]] || continue
              index_asset "$file" "Arch Linux; repositories pinned to snapshot 2026-10-26" "x86_64" ".pkg.tar.zst" "Experimental" "Package-manager lifecycle passed in the recorded snapshot; rolling-release runtime compatibility remains unproven."
            done

            for file in dist/cage-xtmapper-"$GITHUB_REF_NAME"-*.apk; do
              [[ -f "$file" ]] || continue
              index_asset "$file" "Alpine Linux 3.24.3" "x86_64" ".apk" "Experimental" "Musl-native candidate; production signature/trust is not configured and no real Wayland session test has passed."
            done

            for file in dist/cage-xtmapper-installer-linux-amd64 dist/cage-xtmapper-installer-linux-arm64; do
              [[ -f "$file" ]] || continue
              base="$(basename "$file")"
              case "$base" in *amd64) arch="amd64";; *arm64) arch="arm64";; esac
              index_asset "$file" "Installer utility; not a distribution package" "$arch" "Go helper executable" "Component only" "Used by the bootstrap with its matching versioned .tar archive; not a standalone application runtime."
            done
          } > dist/native-package-index.md
          (cd dist && sha256sum native-package-index.md > native-package-index.md.sha256)

      - name: Refuse to modify published releases or overwrite existing tag assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"

          if [[ "$status" == 404 ]]; then
            rm -f "$response"
            echo "No release exists for this tag; the workflow may create a draft."
            exit 0
          fi
          if [[ "$status" != 200 ]]; then
            cat "$response" >&2
            echo "Could not safely inspect release $RELEASE_TAG (HTTP $status)." >&2
            exit 1
          fi
          if jq -e '.draft == false or .published_at != null' "$response" >/dev/null; then
            echo "Refusing to modify an already-published release for $RELEASE_TAG." >&2
            exit 1
          fi

          existing_names="$(jq -r '.assets[]?.name' "$response")"
          for path in \
            dist/cage-xtmapper-*.tar \
            dist/cage-xtmapper-*.tar.sha256 \
            dist/cage-xtmapper-installer-linux-amd64 \
            dist/cage-xtmapper-installer-linux-amd64.sha256 \
            dist/cage-xtmapper-installer-linux-arm64 \
            dist/cage-xtmapper-installer-linux-arm64.sha256 \
            dist/cage-xtmapper-"$RELEASE_TAG"-*.deb \
            dist/cage-xtmapper-"$RELEASE_TAG"-*.deb.sha256 \
            dist/cage-xtmapper-"$RELEASE_TAG"-*.rpm \
            dist/cage-xtmapper-"$RELEASE_TAG"-*.rpm.sha256 \
            dist/cage-xtmapper-"$RELEASE_TAG"-*.pkg.tar.zst \
            dist/cage-xtmapper-"$RELEASE_TAG"-*.pkg.tar.zst.sha256 \
            dist/cage-xtmapper-"$RELEASE_TAG"-*.apk \
            dist/cage-xtmapper-"$RELEASE_TAG"-*.apk.sha256 \
            dist/native-package-index.md \
            dist/native-package-index.md.sha256; do
            [[ -f "$path" ]] || continue
            name="$(basename "$path")"
            if grep -Fxq "$name" <<< "$existing_names"; then
              echo "Refusing to overwrite existing asset $name on tag $RELEASE_TAG." >&2
              exit 1
            fi
          done
          rm -f "$response"

      - name: Attach assets to the matching draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/cage-xtmapper-*.tar
            dist/cage-xtmapper-*.tar.sha256
            dist/cage-xtmapper-installer-linux-amd64
            dist/cage-xtmapper-installer-linux-amd64.sha256
            dist/cage-xtmapper-installer-linux-arm64
            dist/cage-xtmapper-installer-linux-arm64.sha256
            dist/cage-xtmapper-${{ github.ref_name }}-*.deb
            dist/cage-xtmapper-${{ github.ref_name }}-*.deb.sha256
            dist/cage-xtmapper-${{ github.ref_name }}-*.rpm
            dist/cage-xtmapper-${{ github.ref_name }}-*.rpm.sha256
            dist/cage-xtmapper-${{ github.ref_name }}-*.pkg.tar.zst
            dist/cage-xtmapper-${{ github.ref_name }}-*.pkg.tar.zst.sha256
            dist/cage-xtmapper-${{ github.ref_name }}-*.apk
            dist/cage-xtmapper-${{ github.ref_name }}-*.apk.sha256
            dist/native-package-index.md
            dist/native-package-index.md.sha256
          draft: true
          fail_on_unmatched_files: true
          overwrite_files: false
